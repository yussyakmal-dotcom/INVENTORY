name: Inventory foundation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: SQLite API acceptance
        if: matrix.database == 'sqlite'
        run: python -m pytest -q tests/test_foundation.py
      - name: MariaDB API acceptance
        if: matrix.database == 'mariadb'
        env:
          TEST_DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/inventory_test
        run: python -m pytest -q tests/test_foundation.py
      - name: JavaScript syntax
        run: node --check app/static/manufacturing.js
      - name: Install browser test tools
        if: matrix.database == 'sqlite'
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium --only-shell
      - name: Browser acceptance
        if: matrix.database == 'sqlite'
        run: python tests/run_ui_smoke.py
