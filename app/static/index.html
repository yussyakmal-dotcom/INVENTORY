<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventori Multi-Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECF0EE;--surface:#FFFFFF;--surface2:#F5F8F6;--ink:#142322;--muted:#5A6B68;--line:#D3DCD9;--line2:#E4EAE8;
  --side:#10302B;--side-ink:#D5E5E0;--side-muted:#86A9A1;--side-hi:#1C4740;
  --pine:#17735C;--pine-ink:#FFFFFF;--pine-soft:#DCEFE8;
  --amber:#A86C00;--amber-soft:#FBEFD3;--brick:#B23A26;--brick-soft:#F8E1DB;--sky:#2563A6;--sky-soft:#DEE9F6;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1716;--surface:#152120;--surface2:#1A2827;--ink:#E2ECE9;--muted:#95A8A4;--line:#2B3C3A;--line2:#223230;
  --side:#0A1312;--side-ink:#CFE0DB;--side-muted:#7E9C95;--side-hi:#173430;
  --pine:#3FAE8E;--pine-ink:#08201A;--pine-soft:#173B32;--amber:#E2A841;--amber-soft:#3A2D12;--brick:#E8775F;--brick-soft:#3D1F19;--sky:#71A7DE;--sky-soft:#172A3D;}}
:root[data-theme="dark"]{
  --bg:#0E1716;--surface:#152120;--surface2:#1A2827;--ink:#E2ECE9;--muted:#95A8A4;--line:#2B3C3A;--line2:#223230;
  --side:#0A1312;--side-ink:#CFE0DB;--side-muted:#7E9C95;--side-hi:#173430;
  --pine:#3FAE8E;--pine-ink:#08201A;--pine-soft:#173B32;--amber:#E2A841;--amber-soft:#3A2D12;--brick:#E8775F;--brick-soft:#3D1F19;--sky:#71A7DE;--sky-soft:#172A3D;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--pine);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.2}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 240px,transparent 240px)}
.pn{min-width:190px}
.toolbar.filters{margin-top:-4px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.toolbar.filters .fld{min-width:140px;flex:1 1 140px}
tr.grp td{background:var(--pine-soft);border-top:1px solid var(--line)}
.tree{padding-left:calc(var(--l) * 22px);position:relative;white-space:nowrap;min-width:230px}.lvl2 .tree::before,.lvl3 .tree::before{content:"";position:absolute;left:calc(var(--l) * 22px - 14px);top:2px;width:8px;height:10px;border-left:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.6}
tr.lvl1 td{background:var(--surface2)}tr.lvl1 strong{font-size:15px}
.path{display:flex;flex-wrap:wrap;gap:2px 4px;font-size:13px;min-width:200px}.path span+span::before{content:"› ";color:var(--muted)}.path .lv3{font-weight:600}.tw+.panel,.tw+.note+.panel{margin-top:16px}td.mono{white-space:nowrap}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 16px;color:#fff}
.brand strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}.brand span{display:block;font-size:12px;color:var(--side-muted)}
.brand svg{color:#7FD3B8;flex:none}
nav{flex:1;padding:4px 10px 12px}
.ng{margin-top:14px}.ngl{display:block;font-size:12px;color:var(--side-muted);padding:0 10px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--side-ink);font-size:14px}
nav a:hover{background:var(--side-hi);text-decoration:none}
nav a[aria-current]{background:#E8F4F0;color:#10302B;font-weight:600}
nav a em{font-style:normal;font-size:11px;font-weight:700;background:#E2A841;color:#2A1C00;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.who{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08)}
.who label{display:block;font-size:12px;color:var(--side-muted);margin-bottom:4px}
.who select{width:100%;background:var(--side-hi);color:#fff;border:1px solid rgba(255,255,255,.15)}
.who small{display:block;color:var(--side-muted);margin-top:6px;font-size:12px}
/* main */
.main{min-width:0;padding:0 28px 48px}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 16px;position:relative}
.tt span{font-size:13px;color:var(--muted)}.tt h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tr{margin-left:auto;position:relative}
.menu{display:none}
.bell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.bell em{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:11px;font-weight:700;background:var(--brick);color:#fff;border-radius:10px;padding:1px 6px}
.npanel{position:absolute;right:0;top:48px;width:min(380px,86vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,30,26,.18);z-index:30}
.npanel header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface)}
.npanel ul{list-style:none;margin:0;padding:0}.npanel li a{display:block;padding:10px 14px 10px 16px;border-bottom:1px solid var(--line2);color:var(--ink);border-left:3px solid var(--line)}
.npanel li.bad a{border-left-color:var(--brick)}.npanel li.warn a{border-left-color:var(--amber)}.npanel li.sky a{border-left-color:var(--sky)}
.npanel b{display:block;font-weight:600;font-size:14px}.npanel span{font-size:13px;color:var(--muted)}
.pad{padding:14px}
/* controls */
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px;width:100%;min-width:0}
input:disabled,select:disabled{opacity:.6}
input.n{text-align:right}input.sm{max-width:110px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 13px;min-height:36px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{background:var(--brick);border-color:var(--brick);color:#fff}.btn.warnb{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.ghost-bad{color:var(--brick)}.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.file{position:relative}
.icon{background:none;border:0;font-size:20px;line-height:1;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--muted)}.icon:hover{background:var(--surface2);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:150px}.fld>span{font-size:13px;color:var(--muted);font-weight:500}.fld small{font-size:12px;color:var(--muted)}
.fld.grow{flex:1 1 240px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:auto;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 14px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:5px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.formrow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}.formrow>.fld{flex:1 1 160px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface2)}
.n{text-align:right;white-space:nowrap}
.u{color:var(--muted);font-size:12px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.mono{font-feature-settings:"tnum","zero";letter-spacing:.01em}
.nodata{text-align:center;color:var(--muted);padding:26px}
table.edit td{padding:6px 6px}table.edit td:first-child{min-width:220px}table.edit input[type=date]{min-width:140px}
table.mini{font-size:13px}table.mini td,table.mini th{padding:6px 10px}
tr.dim td{opacity:.55}tr.hl td{background:var(--amber-soft)}tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}tr.open td{background:var(--pine-soft)}
tr.diffrow td{background:var(--surface2)}table.diff tr.chg td{background:var(--amber-soft)}table.diff td{max-width:420px;word-break:break-all}
td.acts{white-space:nowrap;text-align:right}td.acts .btn{margin-left:4px}
.bad-t{color:var(--brick);font-weight:600}.ok-t{color:var(--pine);font-weight:600}
.yes{color:var(--pine);font-weight:700}.no{color:var(--muted)}
/* chips */
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--pine-soft);color:var(--pine);border-color:transparent}.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--brick-soft);color:var(--brick);border-color:transparent}.chip.sky{background:var(--sky-soft);color:var(--sky);border-color:transparent}
.chip.info{background:var(--surface2);color:var(--ink)}
/* expiry bar: the signature element */
.exp{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"d l" "b b";gap:2px 10px;min-width:205px;font-size:13px;white-space:nowrap}
.exp-d{grid-area:d}.exp-l{grid-area:l;text-align:right;color:var(--muted)}
.exp-bar{grid-area:b;position:relative;height:6px;background:var(--line2);border-radius:3px}
.exp-bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--pine)}
.exp-bar b{position:absolute;left:33.333%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.exp.warn .exp-bar i{background:var(--amber)}.exp.warn .exp-l{color:var(--amber);font-weight:600}
.exp.bad .exp-bar i{background:repeating-linear-gradient(135deg,var(--brick) 0 5px,transparent 5px 8px)}.exp.bad .exp-l{color:var(--brick);font-weight:700}
/* panels & dashboard */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.panel .tw{border-radius:6px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}.ph h3{font-size:16px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>.panel{margin-bottom:16px}
.grid2.wide-left{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.hello{margin:0 0 16px}.hello h2{font-size:20px;font-weight:600}.hello p{margin:2px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 18px 14px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:2px;position:relative}
.kpi:first-child{border-left:0}.kpi:hover{background:var(--surface2)}.kpi:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line2)}
.kpi.bad::before{background:var(--brick)}.kpi.warn::before{background:var(--amber)}.kpi.sky::before{background:var(--sky)}
.kv{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.kl{font-size:13px;color:var(--muted)}
.ribbon{list-style:none;margin:0;padding:0}.ribbon li{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,1.1fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:center}.ribbon li:last-child{border-bottom:0}
.rbn strong{display:block;font-weight:600;font-size:14px}.rbn span{font-size:12px;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 12px;border-radius:6px;border:1px solid var(--line2);border-left:3px solid var(--line)}
.todo button:hover{background:var(--surface2)}.todo button:focus-visible{outline:2px solid var(--sky)}
.todo .warn button{border-left-color:var(--amber)}.todo .bad button{border-left-color:var(--brick)}.todo .sky button{border-left-color:var(--sky)}
.todo b{display:block;font-weight:600;font-size:14px}.todo span{font-size:13px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0}.bars li{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:8px 0}
.bars i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--pine) var(--w),var(--line2) var(--w))}.bars b{font-weight:600;font-size:14px}.bars small{color:var(--muted)}
/* misc */
.rule{background:var(--pine-soft);border-left:3px solid var(--pine);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:14px}
.alert{padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;border-left:3px solid}
.alert ul{margin:6px 0 0;padding-left:18px}.alert.sm{padding:6px 10px;margin:6px 0 0;font-size:13px}
.alert.warn{background:var(--amber-soft);border-color:var(--amber)}.alert.bad{background:var(--brick-soft);border-color:var(--brick)}.alert.info{background:var(--sky-soft);border-color:var(--sky)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:80ch}
.formula{font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.trend{color:var(--pine)}.spark{display:block}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.steps ol{margin:0;padding-left:20px}.steps li{margin:4px 0;max-width:80ch}
.plain{margin:6px 0;padding-left:18px;font-size:14px}
.tline{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.tlh{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.tlh .fld{min-width:110px}.tlh .chk{padding-bottom:8px}
.avl{font-size:13px;margin-top:8px}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px}.pl{color:var(--muted)}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 8px}.pk small{color:var(--muted)}.pk.strong{font-weight:700}
.arrow{color:var(--muted);font-size:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;margin:0 0 14px}.meta dt{font-size:12px;color:var(--muted)}.meta dd{margin:0;font-size:14px}
.opn-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(8,22,19,.5)}
.mbox{position:relative;background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(980px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2)}.mhead h2{font-size:18px}
.mbody{padding:16px 18px;overflow:auto}.mbody>.fld{margin-bottom:12px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s,transform .3s}
.toast.err{background:var(--brick);color:#fff}.toast.out{opacity:0;transform:translateY(8px)}
/* print document */
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto}
.doc{position:relative;padding:24px;color:#111;font-size:13px;min-width:620px;overflow:hidden}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:rgba(178,58,38,.12);transform:rotate(-24deg);pointer-events:none;letter-spacing:.04em}
.doc header{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
.doc header strong{display:block;font-size:18px}.doc header span{color:#555}.dno{text-align:right;font-weight:700;font-size:16px}.dno span{display:block;font-weight:400;font-size:12px}
.dmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.dmeta b{display:block;font-size:11px;color:#555;font-weight:600}
.doc table{font-size:12px}.doc th{background:#f1f1f1;color:#111}.doc td,.doc th{border:1px solid #ccc;padding:5px 7px}.doc tfoot td{background:#f7f7f7}
.sign{display:flex;gap:24px;margin-top:36px}.sign div{flex:1;border-top:1px solid #111;padding-top:4px;text-align:center;margin-top:40px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}.doc{min-width:0}}
/* responsive */
@media (max-width:1100px){.grid2,.grid2.wide-left{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line2)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .kv{font-size:24px}.kpi{padding:14px}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:env(safe-area-inset-top,0px)}
  body.navopen .side{transform:none;box-shadow:0 0 0 100vmax rgba(8,22,19,.45)}
  .menu{display:grid;place-items:center}
  .main{padding:0 14px 40px}.tt h1{font-size:21px}
  .bars li{grid-template-columns:110px 1fr;}.bars b{grid-column:2}
  .ribbon li{grid-template-columns:minmax(0,1fr)}
  .dmeta{grid-template-columns:repeat(2,1fr)}
}

#login{position:fixed;inset:0;z-index:100;background:var(--side);display:grid;place-items:center;padding:20px;overflow:auto}
#login[hidden]{display:none}
.lbox{background:var(--surface);border-radius:12px;padding:28px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbrand{display:flex;gap:12px;align-items:center;margin-bottom:22px;color:var(--pine)}.lbrand strong{display:block;color:var(--ink);font-size:16px}.lbrand span{font-size:13px;color:var(--muted)}

<div class="app"><aside class="side" id="side"></aside><main class="main"><header class="top" id="top"></header><div id="view"></div></main></div>

<script>
'use strict';
/* ================= CORE ================= */
const DAY = 864e5, HOUR = 36e5, KEY = 'inventori-mvp-v1';
let S = null;
class UserError extends Error {}
const fail = m => { throw new UserError(m); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r4 = n => Math.round((+n || 0) * 1e4) / 1e4;
const num = (n, d = 2) => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: d });
const rp = n => 'Rp\u00a0' + Math.round(+n || 0).toLocaleString('id-ID');
const rpShort = n => n >= 1e9 ? 'Rp\u00a0' + num(n / 1e9, 1) + ' M' : n >= 1e6 ? 'Rp\u00a0' + num(n / 1e6, 1) + ' jt' : rp(n);
const fd = t => t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '–';
const fdt = t => t ? new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const daysLeft = t => Math.floor((t - today0()) / DAY);
const isoDate = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const parseDate = s => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim()); if (!m) return null; return new Date(+m[1], +m[2] - 1, +m[3]).getTime(); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const randToken = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function load() { try { const r = localStorage.getItem(KEY); if (r) { S = JSON.parse(r); return true; } } catch (e) { } return false; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function nid(k) { S.seq[k] = (S.seq[k] || 0) + 1; return S.seq[k]; }
function docNo(p) { const n = nid('doc_' + p); const d = new Date(); return `${p}-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}-${String(n).padStart(4, '0')}`; }

const byId = (arr, id) => arr.find(x => x.id === +id);
const W = id => byId(S.warehouses, id), P = id => byId(S.products, id), C = id => byId(S.categories, id), SU = id => byId(S.suppliers, id), U = id => byId(S.users, id), BR = id => byId(S.brands, id), TY = id => byId(S.types, id);
const central = () => S.warehouses.find(w => w.isCentral && w.isActive);
const actW = () => S.warehouses.filter(w => w.isActive);
const actP = () => S.products.filter(p => p.isActive);
const cur = () => U(S.currentUserId) || S.users[0];
const uoms = p => [{ name: p.baseUom, factor: 1 }, ...(p.uoms || [])];
const uomF = (p, name) => (uoms(p).find(u => u.name === name) || { factor: 1 }).factor;
/* kategori 3 level: Grup (1) > Kategori (2) > Subkategori (3); produk hanya di level 3 */
const LEVEL_NAME = { 1: 'Grup', 2: 'Kategori', 3: 'Subkategori' };
function catChain(id) { const out = []; let c = C(id), g = 0; while (c && g++ < 5) { out.unshift(c); c = c.parentId ? C(c.parentId) : null; } return out; }
const catPath = (id, sep = ' › ') => catChain(id).map(c => c.name).join(sep);
const catAt = (id, lvl) => catChain(id).find(c => c.level === lvl);
function catInherit(id, key) { const ch = catChain(id); for (let i = ch.length - 1; i >= 0; i--) if (ch[i][key] != null && ch[i][key] !== '') return { v: +ch[i][key], from: ch[i] }; return null; }
const leafCats = () => S.categories.filter(c => c.level === 3 && catChain(c.id).every(x => x.isActive)).sort((a, b) => catPath(a.id).localeCompare(catPath(b.id)));
const ttlOf = p => (p.overrideTtl != null && p.overrideTtl !== '') ? +p.overrideTtl : (catInherit(p.categoryId, 'ttlHours')?.v ?? 24);
const thrOf = p => catInherit(p.categoryId, 'expiryDays')?.v ?? S.settings.expiryDays;
const minOf = (p, w) => +(w.isCentral ? p.minCentral : p.minBranch) || 0;

/* ================= ROLES ================= */
const ROLES = {
  admin: { label: 'Admin', perms: ['*'] },
  gudang: { label: 'Staf Gudang', perms: ['inbound', 'transfer', 'usage', 'scrap.create', 'opname.count'] },
  purchasing: { label: 'Purchasing', perms: ['po', 'supplier', 'report'] },
  approver: { label: 'Approver', perms: ['scrap.approve', 'opname.post', 'report', 'audit'] },
};
const PERM_LABEL = { inbound: 'penerimaan barang', transfer: 'transfer', usage: 'pemakaian', 'scrap.create': 'pengajuan scrap', 'scrap.approve': 'approval scrap', 'opname.count': 'hitung stock opname', 'opname.post': 'posting stock opname', po: 'purchase order', supplier: 'master supplier', report: 'laporan', audit: 'audit log', master: 'master data', admin: 'administrasi' };
function can(p) { const r = ROLES[cur().role]; return !!r && (r.perms.includes('*') || r.perms.includes(p)); }
function need(p) { if (!can(p)) fail(`Peran ${ROLES[cur().role].label} tidak punya akses ${PERM_LABEL[p] || p}.`); }
const myWhIds = () => { const u = cur(); return u.warehouseId ? [u.warehouseId] : actW().map(w => w.id); };

/* ================= AUDIT (JSON Lines) ================= */
function audit(action, endpoint, before, after, sysUser) {
  S.audit.unshift({
    timestamp: new Date().toISOString(), user_id: sysUser || cur().username, role: sysUser ? 'system' : cur().role,
    action, endpoint, payload_before: before == null ? null : clone(before), payload_after: after == null ? null : clone(after)
  });
  if (S.audit.length > 3000) S.audit.length = 3000;
}

/* ================= STOCK HELPERS ================= */
const resQty = bid => S.reservations.filter(r => r.batchId === bid).reduce((a, r) => a + r.qty, 0);
const avail = b => Math.max(0, r4(b.qty - resQty(b.id)));
const fifoSort = (a, b) => a.inboundAt - b.inboundAt || a.id - b.id;
const batchesOf = (pid, wid) => S.batches.filter(b => b.productId === +pid && b.warehouseId === +wid && b.qty > 1e-9).sort(fifoSort);
const stockQ = (pid, wid) => S.batches.filter(b => b.productId === +pid && (wid == null || b.warehouseId === +wid)).reduce((a, b) => a + b.qty, 0);
const availQ = (pid, wid) => batchesOf(pid, wid).reduce((a, b) => a + avail(b), 0);
function fifoPlan(pid, wid, qty) {
  let rem = r4(qty); const picks = [];
  for (const b of batchesOf(pid, wid)) { const a = avail(b); if (a <= 1e-9) continue; const q = Math.min(a, rem); picks.push({ batchId: b.id, qty: r4(q) }); rem = r4(rem - q); if (rem <= 1e-9) break; }
  return { picks, short: rem > 1e-9 ? rem : 0 };
}
function fifoViolation(pid, wid, picks) {
  const m = new Map(picks.map(p => [p.batchId, p.qty])); let gap = false;
  for (const b of batchesOf(pid, wid)) { const t = m.get(b.id) || 0; const a = avail(b); if (t > 0 && gap) return true; if (t < a - 1e-9) gap = true; }
  return false;
}
function mv(type, b, qty, ref, note) {
  S.movements.push({ id: nid('mv'), ts: Date.now(), type, productId: b.productId, warehouseId: b.warehouseId, batchId: b.id, batchNo: b.batchNo, qty: r4(qty), cost: b.cost, ref: ref || '', note: note || '', user: cur().username });
}
function deduct(picks, type, ref, note) {
  let cogs = 0; const out = [];
  for (const p of picks) {
    const b = byId(S.batches, p.batchId); b.qty = r4(b.qty - p.qty); cogs += p.qty * b.cost; mv(type, b, -p.qty, ref, note);
    out.push({ batchId: b.id, batchNo: b.batchNo, qty: p.qty, cost: b.cost, expDate: b.expDate, inboundAt: b.inboundAt, rack: b.rack });
  }
  return { cogs: r4(cogs), out };
}
function lowStock() { const out = []; for (const w of actW()) for (const p of actP()) { const q = stockQ(p.id, w.id); const m = minOf(p, w); if (m > 0 && q < m) out.push({ p, w, q, m }); } return out; }
function expiring() {
  return S.batches.filter(b => b.qty > 1e-9 && W(b.warehouseId)?.isActive && P(b.productId))
    .map(b => ({ b, p: P(b.productId), d: daysLeft(b.expDate), thr: thrOf(P(b.productId)) }))
    .filter(x => x.d <= x.thr).sort((a, b) => a.d - b.d);
}
const releaseRes = tid => { S.reservations = S.reservations.filter(r => r.transferId !== tid); };
function sweep() {
  let ch = false; const now = Date.now();
  for (const t of S.transfers) if (t.status === 'draft' && t.expiresAt <= now) {
    const before = clone(t); releaseRes(t.id); t.status = 'kedaluwarsa'; t.closedAt = now;
    audit('TRANSFER_RESERVATION_EXPIRED', `/api/v1/transfer/${t.no}/expire`, before, t, 'system'); ch = true;
  }
  if (ch) save(); return ch;
}

/* ================= SEED ================= */
function seed() {
  const now = Date.now(), t0 = today0();
  S = { v: 2, seq: {}, brands: [], types: [], settings: { expiryDays: 14, safetyDays: 3, coverDays: 14, forecastWindow: 30, priceTolerance: 15, company: 'KotakRasa' },
    currentUserId: 1, users: [], warehouses: [], categories: [], products: [], suppliers: [], batches: [], reservations: [], transfers: [], scraps: [], movements: [], pos: [], inbounds: [], usages: [], leadHistory: [], opnames: [], audit: [], ui: { page: 'dashboard' } };
  const add = (k, o) => { o.id = nid(k); S[k].push(o); return o; };
  [['GDC', 'Gudang Central', true, true], ['CBG-UTR', 'Cabang Utara', false, true], ['CBG-SEL', 'Cabang Selatan', false, true], ['CBG-LMA', 'Cabang Lama (tutup)', false, false]]
    .forEach(([code, name, isCentral, isActive]) => add('warehouses', { code, name, isCentral, isActive }));
  [['Rina Hapsari', 'rina', 'admin', null], ['Budi Santoso', 'budi', 'gudang', 1], ['Sari Lestari', 'sari', 'gudang', 2], ['Dimas Pratama', 'dimas', 'purchasing', null], ['Wulan Anggraini', 'wulan', 'approver', null]]
    .forEach(([name, username, role, warehouseId]) => add('users', { name, username, role, warehouseId, isActive: true }));
  const cat = (name, parent, ttl, exp) => add('categories', { name, parentId: parent ? parent.id : null, level: parent ? parent.level + 1 : 1, ttlHours: ttl ?? null, expiryDays: exp ?? null, isActive: true });
  const g1 = cat('Bahan Baku', null, 24, 14), g2 = cat('Kemasan', null, 72, 60); cat('Perlengkapan Operasional', null, 72, 60);
  const kKer = cat('Bahan Kering', g1, 48, 30), kDai = cat('Dairy & Chiller', g1, 12, 7), kPro = cat('Protein Beku', g1, 12, 14), kSau = cat('Saus & Bumbu', g1, 24, 21), kMin = cat('Kemasan Minuman', g2); cat('Kemasan Makanan', g2);

/* ================= TRANSFER ================= */
function createTransfer(d) {
  need('transfer');
  const src = W(d.srcId), dst = W(d.dstId);
  if (!src || !src.isActive) fail('Pilih gudang asal yang aktif.');
  if (!dst || !dst.isActive) fail('Pilih gudang tujuan yang aktif.');
  if (src.id === dst.id) fail('Gudang asal dan tujuan tidak boleh sama.');
  if (!myWhIds().includes(src.id)) fail('Anda hanya bisa membuat transfer dari gudang tugas Anda.');
  const lines = d.lines.filter(l => l.productId);
  if (!lines.length) fail('Tambahkan minimal satu barang.');
  const seen = new Set(); let ttl = Infinity, override = false; const out = [];
  for (const l of lines) {
    const p = P(l.productId); if (!p || !p.isActive) fail('Produk tidak aktif.');
    if (seen.has(p.id)) fail(`${p.name} tercantum dua kali. Gabungkan dalam satu baris.`); seen.add(p.id);
    const q = r4(l.qty); if (!(q > 0)) fail(`Jumlah ${p.name} harus lebih dari 0.`);
    let picks;
    if (l.manual) {
      picks = Object.entries(l.picks || {}).map(([bid, v]) => ({ batchId: +bid, qty: r4(v) })).filter(x => x.qty > 0);
      const sum = r4(picks.reduce((a, x) => a + x.qty, 0));
      if (Math.abs(sum - q) > 1e-6) fail(`Total pilihan batch ${p.name} (${num(sum)}) harus sama dengan jumlah transfer (${num(q)} ${p.baseUom}).`);
      for (const pk of picks) { const b = byId(S.batches, pk.batchId); if (!b || b.warehouseId !== src.id || b.productId !== p.id) fail('Batch tidak valid.'); if (pk.qty > avail(b) + 1e-9) fail(`Batch ${b.batchNo} hanya tersedia ${num(avail(b))} ${p.baseUom}.`); }
      if (fifoViolation(p.id, src.id, picks)) override = true;
    } else {
      const plan = fifoPlan(p.id, src.id, q);
      if (plan.short > 0) fail(`Stok ${p.name} di ${src.name} tidak cukup: tersedia ${num(q - plan.short)} ${p.baseUom}, diminta ${num(q)}. Transfer tidak mengenal backorder, kurangi jumlahnya.`);
      picks = plan.picks;
    }
    ttl = Math.min(ttl, ttlOf(p));
    out.push({ productId: p.id, qty: q, uom: l.uom || p.baseUom, uomQty: +l.uomQty || q, picks: picks.map(pk => { const b = byId(S.batches, pk.batchId); return { batchId: b.id, batchNo: b.batchNo, expDate: b.expDate, cost: b.cost, inboundAt: b.inboundAt, rack: b.rack, qty: pk.qty, received: null }; }) });
  }
  if (override && !d.confirmOverride) return { needConfirm: true };
  const now = Date.now();
  const t = { id: nid('transfers'), no: docNo('TRF'), srcId: src.id, dstId: dst.id, status: 'draft', createdAt: now, createdBy: cur().username, expiresAt: now + ttl * HOUR, ttlHours: ttl, shippedAt: null, receivedAt: null, printCount: 0, fifoOverride: override, note: d.note || '', lines: out };
  S.transfers.push(t);
  out.forEach(l => l.picks.forEach(pk => S.reservations.push({ id: nid('reservations'), transferId: t.id, batchId: pk.batchId, qty: pk.qty, expiresAt: t.expiresAt })));
  audit('CREATE_DRAFT_TRANSFER', '/api/v1/transfer/draft', null, t);
  return t;
}
function shipTransfer(id) {
  need('transfer'); const t = byId(S.transfers, id);
  if (t.status !== 'draft') fail('Hanya draft yang bisa dikirim.');
  if (t.expiresAt <= Date.now()) { sweep(); fail('Reservasi sudah habis waktunya. Buat draft baru.'); }
  if (!myWhIds().includes(t.srcId)) fail('Hanya staf gudang asal yang bisa mengirim.');
  for (const l of t.lines) for (const pk of l.picks) { const b = byId(S.batches, pk.batchId); if (!b || b.qty < pk.qty - 1e-9) fail(`Stok batch ${pk.batchNo} berubah dan tidak cukup lagi.`); }

  for (const l of t.lines) deduct(l.picks.map(pk => ({ batchId: pk.batchId, qty: pk.qty })), 'TRF_OUT', t.no);
  t.status = 'dikirim'; t.shippedAt = Date.now(); t.shippedBy = cur().username;

function cancelTransfer(id) {

function receiveTransfer(id, rec) {
  need('transfer'); const t = byId(S.transfers, id);

  if (!myWhIds().includes(t.dstId)) fail('Hanya staf gudang tujuan yang bisa menerima.');
  t.lines.forEach((l, li) => l.picks.forEach((pk, pi) => { const v = rec[li]?.[pi]; if (v === '' || v == null || isNaN(+v) || +v < 0) fail('Isi jumlah diterima untuk setiap batch (0 jika tidak ada).'); }));

      let b = S.batches.find(x => x.warehouseId === t.dstId && x.productId === l.productId && x.batchNo === pk.batchNo && x.expDate === pk.expDate && x.cost === pk.cost);

function createManualScrap({ warehouseId, batchId, qty, reason }) {

  if (!myWhIds().includes(w.id)) fail('Anda hanya bisa mencatat pemakaian di gudang tugas Anda.');
  const p = P(productId); if (!p || !p.isActive) fail('Pilih produk.');
  const q = r4(+uomQty * uomF(p, uom)); if (!(q > 0)) fail('Jumlah harus lebih dari 0.');

function inboundCheck(d) {

  else if (!myWhIds().includes(c.id)) errors.push('Penerimaan barang hanya dilakukan staf Gudang Central.');
  if (!d.supplierId || !SU(d.supplierId)?.isActive) errors.push('Pilih supplier.');
  if (d.poId) { const po = byId(S.pos, d.poId); if (!po || po.status !== 'dipesan') errors.push('PO tidak dalam status dipesan.'); else if (po.supplierId !== +d.supplierId) errors.push('Supplier tidak sesuai dengan PO.'); }
  const lines = d.lines.filter(l => l.productId);
  if (!lines.length) errors.push('Tambahkan minimal satu barang.');
  const keys = new Set();
  lines.forEach((l, i) => {
    const p = P(l.productId); const n = `Baris ${i + 1} (${p.name})`; const f = uomF(p, l.uom); const qty = +l.qty, cost = +l.cost;
    if (!(qty > 0)) errors.push(`${n}: jumlah harus lebih dari 0.`);

/* ================= STOK ================= */
V.stock = () => {
  const f = F.stk; const ws = actW().filter(w => !f.wid || w.id === +f.wid); const q = (f.q || '').toLowerCase();
  const ps = actP().filter(p => prodMatch(p, f) && (!q || (p.name + ' ' + p.code + ' ' + (BR(p.brandId)?.name || '')).toLowerCase().includes(q)));
  let body;
  if (f.mode === 'sum') {
    const items = [];
    for (const w of ws) for (const p of ps) {
      const bs = S.batches.filter(b => b.productId === p.id && b.warehouseId === w.id && b.qty > 1e-9); const m = minOf(p, w);
      if (!bs.length && !(m > 0)) continue;
      items.push({ p, w, m, qty: bs.reduce((a, b) => a + b.qty, 0), res: bs.reduce((a, b) => a + resQty(b.id), 0), v: bs.reduce((a, b) => a + b.qty * b.cost, 0), near: bs.slice().sort((a, b) => a.expDate - b.expDate)[0], g: f.group ? groupOf(f.group, p, w) : '' });
    }
    if (f.group) items.sort((a, b) => a.g.localeCompare(b.g));
    const rows = []; let lastG = null; const tot = items.reduce((a, x) => a + x.v, 0);
    for (const x of items) {
      if (f.group && x.g !== lastG) { lastG = x.g; const gi = items.filter(y => y.g === x.g); const gv = gi.reduce((a, y) => a + y.v, 0); rows.push(`<tr class="grp"><td colspan="6"><strong>${esc(x.g)}</strong> <span class="muted">${gi.length} posisi stok, ${new Set(gi.map(y => y.p.id)).size} produk${gi.some(y => y.qty < y.m) ? `, ${gi.filter(y => y.qty < y.m).length} di bawah minimum` : ''}</span></td><td class="n">${rp(gv)}</td><td colspan="2" class="muted">${tot ? (gv / tot * 100).toFixed(1) + '% dari total' : ''}</td></tr>`); }
      const { p, w, m, qty, res, v, near } = x;
      rows.push(`<tr><td>${pname(p)}</td><td>${esc(w.name)}</td><td class="n${qty < m ? ' bad-t' : ''}">${qtyU(qty, p)}</td><td class="n">${res ? num(res) : '–'}</td><td class="n">${num(qty - res)}</td><td class="n">${num(m)}</td><td class="n">${rp(v)}</td><td>${near ? expCell(near.expDate, p) : '–'}</td><td>${qty < m ? chip('Di bawah minimum', 'bad') : chip('Cukup', 'ok')}</td></tr>`);
    }
    body = tbl(['Produk', 'Gudang', ['Stok', 'n'], ['Reservasi', 'n'], ['Tersedia', 'n'], ['Minimum', 'n'], ['Nilai', 'n'], 'Kedaluwarsa terdekat', 'Status'], rows, { empty: 'Tidak ada stok yang cocok dengan filter.', foot: items.length ? `<tfoot><tr><td colspan="6">Total ${items.length} posisi stok</td><td class="n">${rp(tot)}</td><td colspan="2"></td></tr></tfoot>` : '' });
  } else {
    const bs = S.batches.filter(b => b.qty > 1e-9 && ws.some(w => w.id === b.warehouseId) && ps.some(p => p.id === b.productId)).sort((a, b) => a.warehouseId - b.warehouseId || a.productId - b.productId || fifoSort(a, b));
    body = tbl(['Produk', 'Gudang', 'Batch', 'Rak', 'Masuk', 'Kedaluwarsa', ['Qty', 'n'], ['Reservasi', 'n'], ['HPP/satuan', 'n'], ['Nilai', 'n']],
      bs.map(b => { const p = P(b.productId); const r = resQty(b.id); return `<tr><td>${pname(p)}</td><td>${esc(W(b.warehouseId).name)}</td><td class="mono">${esc(b.batchNo)}</td><td>${esc(b.rack || '–')}</td><td>${fd(b.inboundAt)}</td><td>${expCell(b.expDate, p)}</td><td class="n">${qtyU(b.qty, p)}</td><td class="n">${r ? num(r) : '–'}</td><td class="n">${rp(b.cost)}</td><td class="n">${rp(b.qty * b.cost)}</td></tr>`; }), { empty: 'Tidak ada batch yang cocok dengan filter.' });
  }
  return `<div class="toolbar">
    ${fld('Gudang', whSel('stk.wid', f.wid, actW(), { rr: 1, blank: 'Semua gudang' }))}
    ${fld('Cari produk', `<input type="search" data-bind="stk.q" data-rr="input" value="${esc(f.q)}" placeholder="Nama, kode, atau merek">`)}
    ${f.mode === 'sum' ? groupSel('stk.group', f.group, [['wh', 'Gudang']]) : ''}
    <div class="sp"></div>${seg('stk.mode', f.mode, [['sum', 'Per gudang'], ['batch', 'Per batch (FIFO)']])}
  </div><div class="toolbar filters">${prodFilters('stk')}${(f.c1 || f.type || f.brand) ? btn('Hapus filter', 'clearProdF', { k: 'stk' }, { k: 'sm' }) : ''}</div>${body}`;
};

/* ================= FORECAST ================= */
function spark(arr) {
  const w = 96, h = 26, max = Math.max(1e-9, ...arr); const step = w / Math.max(1, arr.length - 1);
  const pts = arr.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
}
A.setWin = d => { S.settings.forecastWindow = +d.val; F.fcSel = null; commit(); };
V.forecast = () => {
  const win = S.settings.forecastWindow; const rows = forecast(win).filter(r => prodMatch(r.p, F.fcf)); const st0 = S.settings;
  if (!F.fcSel) { F.fcSel = {}; rows.forEach(r => { if (r.status === 'pesan' && r.recU > 0) F.fcSel[r.p.id] = true; }); }
  const ST = { pesan: ['Pesan sekarang', 'bad'], pantau: ['Pantau', 'warn'], aman: ['Aman', 'ok'] };
  const order = { pesan: 0, pantau: 1, aman: 2 }; rows.sort((a, b) => order[a.status] - order[b.status] || b.rec * b.p.refPrice - a.rec * a.p.refPrice);

const TYPE_L = { IN: 'Penerimaan', TRF_OUT: 'Transfer keluar', TRF_IN: 'Transfer masuk', USE: 'Pemakaian', SCRAP: 'Scrap', ADJ: 'Penyesuaian opname' };

    if (r.group) return { head: [gl, 'Produk', 'Batch', 'Nilai FIFO', 'Porsi'], num: [1, 2, 3, 4], money: [3], share: [4], rows: grouped(items), total: 3 };

  }

    return { head: ['Gudang', 'Kode', 'Produk', 'Merek', 'Subkategori', 'Qty terpakai', 'Satuan', 'HPP'], num: [5, 7], money: [7], total: 7, rows: items.sort((a, b) => b.v - a.v).map(a => [a.w.name, a.p.code, a.p.name, BR(a.p.brandId)?.name || '–', catPath(a.p.categoryId), a.q, a.p.baseUom, a.v]) };

/* ================= SERVER MODE (Docker / FastAPI) ================= */
let ME = null, CFG = {}, VER = 0, PENDING_AUD = [], saving = false, dirty = false, saveTimer = null, errBackoff = 0;
async function api(method, path, body) {
  let r;
  try { r = await fetch(path, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const er = new UserError('Server tidak bisa dihubungi. Periksa jaringan.'); er.status = 0; throw er; }
  let data = null; try { data = await r.json(); } catch (e) { }
  if (r.status === 401 && path !== '/api/auth/login') { showLogin('Sesi berakhir. Silakan masuk lagi.'); const er = new UserError('Sesi berakhir.'); er.status = 401; throw er; }
  if (!r.ok) { const er = new UserError(typeof data?.detail === 'string' ? data.detail : `Permintaan gagal (${r.status}).`); er.status = r.status; throw er; }
  return data;
}
function audit(action, endpoint, before, after, sysUser) {
  const e = { timestamp: new Date().toISOString(), user_id: sysUser || cur().username, role: sysUser ? 'system' : cur().role, action, endpoint, payload_before: before == null ? null : clone(before), payload_after: after == null ? null : clone(after) };
  S.audit.unshift(e); if (S.audit.length > 3000) S.audit.length = 3000; PENDING_AUD.push(e);
}
function load() { return false; }
function save() { if (!ME || !S) return; dirty = true; setSync('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300 + errBackoff); }
async function flush() {
  if (saving || !dirty) return; saving = true; dirty = false;
  const aud = PENDING_AUD.splice(0); const { users, currentUserId, ui, ...data } = S;
  try { const r = await api('PUT', '/api/state', { version: VER, data, audit: aud }); VER = r.version; errBackoff = 0; setSync(dirty ? 'saving' : 'ok'); }
  catch (e) {
    if (e.status === 409) { dirty = false; PENDING_AUD.length = 0; await pullState(); closeModal(); render(); toast('Data baru saja diubah pengguna lain dan sudah dimuat ulang. Perubahan terakhir Anda tidak tersimpan, silakan ulangi.', 'err'); }
    else if (e.status !== 401) { PENDING_AUD.unshift(...aud); dirty = true; errBackoff = Math.min(15000, (errBackoff || 1000) * 2); setSync('err'); }
  } finally { saving = false; if (dirty) saveTimer = setTimeout(flush, 300 + errBackoff); }
}
function setSync(s) { const el = document.getElementById('syncState'); if (el) { el.dataset.s = s; el.textContent = { ok: 'Tersimpan di server', saving: 'Menyimpan…', err: 'Gagal menyimpan, mencoba lagi…' }[s]; } }
function emptyState() {
  seed();
  Object.assign(S, { products: [], suppliers: [], batches: [], reservations: [], transfers: [], scraps: [], movements: [], pos: [], inbounds: [], usages: [], leadHistory: [], opnames: [], audit: [] });
  S.warehouses = S.warehouses.filter(w => w.isCentral);
}
async function pullState() {
  const r = await api('GET', '/api/state'); const ui = S?.ui;
  if (r.foundationActive) { window.location.replace('/manufacturing'); throw new UserError('Fondasi server sudah aktif. Membuka halaman manufaktur.'); }
  let migrated = false;
  if (r.data) { S = r.data; VER = r.version; migrated = migrate(); }
  else { (CFG.demoData ? seed : emptyState)(); VER = 0; }
  S.users = r.users; S.currentUserId = ME.id; S.ui = ui || S.ui || { page: 'dashboard' };
  if (migrated) save();
  if (!r.data) { audit(CFG.demoData ? 'INIT_DEMO_DATA' : 'INIT_EMPTY_DATA', '/api/state', null, null); save(); }
}
async function refreshUsers() { const list = await api('GET', '/api/users'); S.users = list; const me = list.find(u => u.id === ME.id); if (me) ME = me; }

/* ---------- login screen ---------- */
function loginShell(inner) {
  let el = document.getElementById('login'); if (!el) { el = document.createElement('div'); el.id = 'login'; document.body.appendChild(el); }
  el.hidden = false; el.innerHTML = `<div class="lbox"><div class="lbrand"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M4 11 16 5l12 6v12l-12 6-12-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 11l12 6 12-6M16 17v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 8l12 6" stroke="currentColor" stroke-width="2"/></svg><div><strong>Inventori Multi-Gudang</strong><span>Sistem MVP</span></div></div>${inner}</div>`;
  setTimeout(() => el.querySelector('input')?.focus(), 30); return el;
}
function showLogin(msg) {
  ME = null; clearTimeout(saveTimer); closeModal();
  const el = loginShell(`<form id="loginForm"><h1>Masuk</h1>${msg ? `<p class="lmsg">${esc(msg)}</p>` : ''}
    <label class="fld"><span>Username</span><input name="username" autocomplete="username" required></label>
    <label class="fld"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="lerr" role="alert"></p><button class="btn pri" type="submit">Masuk</button></form>`);
  el.querySelector('form').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; const b = f.querySelector('button'); b.disabled = true; f.querySelector('.lerr').textContent = '';
    try { const r = await api('POST', '/api/auth/login', { username: f.username.value, password: f.password.value }); ME = r.user; CFG = r.config; await afterLogin(); }
    catch (e) { f.querySelector('.lerr').textContent = e.message; b.disabled = false; }
  };
}
function showChangePw(forced) {
  const el = loginShell(`<form id="pwForm"><h1>${forced ? 'Buat password baru' : 'Ganti password'}</h1><p class="lmsg">${forced ? 'Ini login pertama Anda. Ganti password bawaan sebelum melanjutkan.' : ''} Minimal 8 karakter, memuat huruf besar dan angka.</p>
    <label class="fld"><span>Password saat ini</span><input name="old" type="password" autocomplete="current-password" required></label>
    <label class="fld"><span>Password baru</span><input name="new" type="password" autocomplete="new-password" required minlength="8"></label>
    <label class="fld"><span>Ulangi password baru</span><input name="new2" type="password" autocomplete="new-password" required></label>
    <p class="lerr" role="alert"></p><div class="lacts">${forced ? '' : '<button class="btn" type="button" id="pwCancel">Batal</button>'}<button class="btn pri" type="submit">Simpan password</button></div></form>`);
  if (!forced) el.querySelector('#pwCancel').onclick = () => { el.hidden = true; };
  el.querySelector('form').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; const err = f.querySelector('.lerr');
    if (f.new.value !== f.new2.value) { err.textContent = 'Ulangan password baru tidak sama.'; return; }
    try { const r = await api('POST', '/api/auth/password', { old: f.old.value, new: f.new.value }); ME = r.user; toast('Password diganti.'); if (forced) await afterLogin(); else el.hidden = true; }
    catch (e) { err.textContent = e.message; }
  };
}
async function afterLogin() {
  if (ME.mustChangePassword) { showChangePw(true); return; }
  const foundation = await api('GET', '/api/manufacturing/setup');
  if (foundation.active) { window.location.replace('/manufacturing'); return; }
  await pullState(); resetForms(); document.getElementById('login').hidden = true; render(); setSync('ok');
}
A.logout = async () => { if (dirty || saving) await flush(); try { await api('POST', '/api/auth/logout'); } catch (e) { } S = null; showLogin('Anda sudah keluar.'); };
A.changePw = () => showChangePw(false);

/* ---------- overrides of prototype UI ---------- */
A.go = d => { if (d.page) S.ui.page = d.page; F.notifOpen = false; document.body.classList.remove('navopen'); closeModal(); render(); window.scrollTo(0, 0); };
const _renderSide = renderSide;
renderSide = function () {
  _renderSide(); const u = cur(); const who = document.querySelector('#side .who');
  const nav = document.querySelector('#side nav');
  if (nav) nav.insertAdjacentHTML('beforeend', '<div class="ng"><a href="/manufacturing">Fondasi manufaktur</a></div>');
  if (who) who.innerHTML = `<div class="me"><strong>${esc(u.name)}</strong><span>${esc(ROLES[u.role]?.label || u.role)}${u.warehouseId ? ', ' + esc(W(u.warehouseId)?.name || 'gudang #' + u.warehouseId) : ''}</span></div>
  <small id="syncState" data-s="ok">Tersimpan di server</small><div class="meacts"><button type="button" class="lnk" data-act="changePw">${ic('key')}Ganti password</button><button type="button" class="lnk" data-act="logout">${ic('logout')}Keluar</button></div>`;
};
A.editUser = d => {
  const u = d.id ? U(d.id) : null;
  F.usr = u ? { id: u.id, name: u.name, username: u.username, role: u.role, warehouseId: String(u.warehouseId || ''), password: '' } : { id: null, name: '', username: '', role: 'gudang', warehouseId: '', password: '' };
  openModal({ title: u ? `Ubah ${u.name}` : 'Pengguna baru', body: () => `<div class="formrow">${fld('Nama', `<input data-bind="usr.name" value="${esc(F.usr.name)}" maxlength="80">`, '', 'grow')}${fld('Username', `<input data-bind="usr.username" value="${esc(F.usr.username)}" maxlength="30" ${u ? 'disabled' : ''}>`)}</div>
    <div class="formrow">${fld('Peran', `<select data-bind="usr.role">${Object.entries(ROLES).map(([k, r]) => opt(k, r.label, F.usr.role)).join('')}</select>`)}${fld('Lingkup gudang', whSel('usr.warehouseId', F.usr.warehouseId, actW(), { blank: 'Semua gudang' }))}</div>
    ${fld(u ? 'Reset password (opsional)' : 'Password awal', `<input type="password" autocomplete="new-password" data-bind="usr.password" value="${esc(F.usr.password)}">`, 'Minimal 8 karakter dengan huruf besar dan angka. Pengguna wajib menggantinya saat login berikutnya.')}`,
    foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button>${btn('Simpan', 'saveUser', {}, { k: 'pri', perm: 'admin' })}` });
};
A.saveUser = async () => {
  const f = F.usr; const body = { name: f.name, role: f.role, warehouseId: f.warehouseId || null };
  if (f.password) body.password = f.password;
  try { need('admin'); if (f.id) await api('PUT', `/api/users/${f.id}`, body); else await api('POST', '/api/users', { ...body, username: f.username }); await refreshUsers(); closeModal(); render(); toast(`${f.name} tersimpan.`); }
  catch (e) { handleErr(e); }
};
const _toggleActive = A.toggleActive;
A.toggleActive = d => {
  if (d.kind !== 'users') return _toggleActive(d);
  const u = U(d.id);
  confirmBox(u.isActive ? 'Nonaktifkan pengguna' : 'Aktifkan pengguna', `<p><strong>${esc(u.name)}</strong> ${u.isActive ? 'tidak bisa login lagi dan sesi aktifnya diputus. Riwayatnya tetap tersimpan.' : 'bisa login kembali.'}</p>`, u.isActive ? 'Nonaktifkan' : 'Aktifkan', async () => {
    try { await api('PUT', `/api/users/${u.id}`, { isActive: !u.isActive }); await refreshUsers(); closeModal(); render(); toast(`${u.name} ${u.isActive ? 'dinonaktifkan' : 'diaktifkan'}.`); } catch (e) { handleErr(e); }
  }, u.isActive ? 'bad' : 'pri');
};
A.resetDemo = () => {
  openModal({ title: 'Atur ulang data', body: () => `<p>Semua transaksi dan master data di server akan diganti. Akun pengguna tidak berubah. Tindakan ini berlaku untuk semua pengguna.</p><div class="alert warn">${ic('alert')}Pastikan Anda sudah mengekspor laporan yang diperlukan.</div>`,
    foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button><div class="sp"></div>${btn('Mulai dari kosong', 'resetData', { mode: 'empty' }, { k: 'bad', perm: 'admin' })}${btn('Isi data demo', 'resetData', { mode: 'demo' }, { k: 'bad', perm: 'admin' })}` });
};
A.resetData = d => { need('admin'); const users = S.users, ui = S.ui; (d.mode === 'demo' ? seed : emptyState)(); S.users = users; S.currentUserId = ME.id; S.ui = ui; audit(d.mode === 'demo' ? 'RESET_DEMO_DATA' : 'RESET_EMPTY_DATA', '/api/state/reset', null, null); resetForms(); closeModal(); commit(d.mode === 'demo' ? 'Data demo dimuat.' : 'Data dikosongkan. Mulai dari master data.'); };

function init() {
  setInterval(async () => {
    if (!ME || !S) return;
    if (sweep()) { render(); return; }
    if (saving || dirty || M || document.activeElement?.matches('input,select,textarea')) return;
    try { const v = await api('GET', '/api/state/version'); if (v.version !== VER) { await pullState(); render(); } } catch (e) { }
  }, 15000);
  window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });
  (async () => { try { const r = await api('GET', '/api/auth/me'); ME = r.user; CFG = r.config; await afterLogin(); } catch (e) { if (e.status !== 401) showLogin(e.message); else if (!ME) showLogin(); } })();
}

init();

</script>
